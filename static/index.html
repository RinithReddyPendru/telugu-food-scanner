<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scan Food</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Google Firebase Compat SDKs (App + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0B1320;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .screen {
      width: 100%;
      max-width: 412px;
      min-height: 100vh;
      background-color: #0B1320;
      padding: 14px 18px 40px;
      display: flex;
      flex-direction: column;
    }

    /* Top Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 50px;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      opacity: 0.95;
      transition: opacity 0.15s ease;
    }

    .icon-btn:hover {
      opacity: 0.75;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }

    .view-section {
      display: none;
      flex-direction: column;
    }

    .view-section.active {
      display: flex;
    }

    /* ==========================================
       VIEW 1: HOME SCREEN (Viewfinder + History)
       ========================================== */
    .viewfinder-card {
      position: relative;
      width: 100%;
      height: 242px;
      background-color: #131D2E;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: outline 0.15s ease, background-color 0.15s ease;
    }

    .viewfinder-card:hover {
      background-color: #162236;
    }

    .viewfinder-card.drag-over {
      outline: 2.5px dashed #DF2963;
      outline-offset: -4px;
    }

    /* 4 Gold Corner Brackets */
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: #D4A442;
      border-style: solid;
      border-width: 0;
      pointer-events: none;
    }

    .corner.tl {
      top: 20px;
      left: 22px;
      border-top-width: 3px;
      border-left-width: 3px;
      border-top-left-radius: 10px;
    }

    .corner.tr {
      top: 20px;
      right: 22px;
      border-top-width: 3px;
      border-right-width: 3px;
      border-top-right-radius: 10px;
    }

    .corner.bl {
      bottom: 20px;
      left: 22px;
      border-bottom-width: 3px;
      border-left-width: 3px;
      border-bottom-left-radius: 10px;
    }

    .corner.br {
      bottom: 20px;
      right: 22px;
      border-bottom-width: 3px;
      border-right-width: 3px;
      border-bottom-right-radius: 10px;
    }

    .viewfinder-circle {
      width: 106px;
      height: 106px;
      border-radius: 50%;
      background-color: #212C3E;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #647084;
    }

    .viewfinder-hint {
      text-align: center;
      font-size: 14.5px;
      font-weight: 600;
      color: #E2E8F0;
      margin: 16px 0 16px;
      letter-spacing: -0.01em;
    }

    .btn-take-photo {
      width: 100%;
      height: 50px;
      background-color: #DF2963;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 15.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn-take-photo:active {
      transform: scale(0.985);
    }

    .btn-choose-gallery {
      margin-top: 12px;
      width: 100%;
      height: 50px;
      background-color: #101726;
      color: #DF2963;
      border: 1.5px solid #DF2963;
      border-radius: 12px;
      font-size: 15.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.12s ease;
    }

    .btn-choose-gallery:hover {
      background-color: rgba(223, 41, 99, 0.08);
    }

    .btn-choose-gallery:active {
      transform: scale(0.985);
    }

    .laptop-paste-bar {
      margin-top: 10px;
      align-self: center;
      background: none;
      border: none;
      color: #7D899B;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .laptop-paste-bar:hover {
      color: #CBD5E1;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .section-divider {
      height: 1px;
      background-color: rgba(255, 255, 255, 0.06);
      margin: 18px -18px 18px;
    }

    /* Previous Scans Section */
    .prev-scans-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .prev-scans-title {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }

    .prev-scans-subtitle {
      font-size: 12.5px;
      font-weight: 400;
      color: #8A94A6;
      margin-top: 2px;
    }

    .sync-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2.5px 8px;
      border-radius: 999px;
      background: rgba(255, 179, 0, 0.14);
      color: #FFB300;
      border: 1px solid rgba(255, 179, 0, 0.32);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.2px;
      transition: all 0.2s ease;
    }

    .sync-badge.online {
      background: rgba(34, 197, 94, 0.14);
      color: #4ADE80;
      border-color: rgba(34, 197, 94, 0.35);
    }

    .sync-badge.local {
      background: rgba(148, 163, 184, 0.12);
      color: #94A3B8;
      border-color: rgba(148, 163, 184, 0.25);
    }

    .view-all-link {
      background: none;
      border: none;
      color: #DF2963;
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding-top: 3px;
    }

    .prev-scans-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .scan-history-card {
      background-color: #121B2B;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .scan-history-card:hover {
      background-color: #162235;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .history-thumb {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      background-color: #1E293B;
    }

    .history-body {
      flex: 1;
      min-width: 0;
    }

    .history-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .history-dish-name {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-status-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34D399;
      font-size: 11px;
      font-weight: 600;
      padding: 2.5px 9px;
      border-radius: 999px;
    }

    .history-chevron {
      color: #8A94A6;
      width: 15px;
      height: 15px;
    }

    .history-meta {
      font-size: 11.5px;
      color: #8A94A6;
      margin: 3px 0 9px;
    }

    .history-macros {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
    }

    .macro-col {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-right: 4px;
    }

    .macro-col + .macro-col {
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      padding-left: 7px;
    }

    .macro-mini-icon {
      width: 14px;
      height: 14px;
      color: #DF2963;
      flex-shrink: 0;
    }

    .macro-mini-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .macro-mini-val {
      font-size: 12px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .macro-mini-lbl {
      font-size: 10px;
      color: #8A94A6;
    }

    /* ==========================================
       VIEW 2: RESULT SCREEN (Photo + White Card)
       ========================================== */
    .photo-card {
      position: relative;
      width: 100%;
      height: 276px;
      border-radius: 20px;
      overflow: hidden;
      background-color: #162032;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Scanning Overlay */
    .scan-overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 19, 32, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
    }

    .scan-overlay.active {
      display: flex;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #DF2963;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* White Nutrition Result Card */
    .result-card {
      background-color: #FFFFFF;
      border-radius: 20px;
      padding: 20px 18px;
      margin-top: 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    .dish-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: #FEF5E4;
      color: #D48817;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .category-badge svg {
      width: 13px;
      height: 13px;
      stroke: #D48817;
      flex-shrink: 0;
    }

    .dish-title {
      font-size: 18.5px;
      font-weight: 700;
      color: #1E232C;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .detected-items-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: -6px 0 14px;
    }

    .detected-item-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: #F3F5F8;
      border: 1px solid #E2E7EE;
      color: #364152;
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .detected-item-grams {
      color: #697586;
      font-weight: 500;
    }

    /* 2x2 Nutrient Grid */
    .nutrient-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .nutrient-item {
      border-radius: 14px;
      padding: 12px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .nutrient-item.calories {
      background-color: #FAF5EA;
    }

    .nutrient-item.protein {
      background-color: #F9EBEE;
    }

    .nutrient-item.iron {
      background-color: #E7F1EC;
    }

    .nutrient-item.calcium {
      background-color: #FCEBF1;
    }

    .nutrient-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .nutrient-item.calories .nutrient-icon {
      background-color: #F2B851;
    }

    .nutrient-item.protein .nutrient-icon {
      background-color: #C92A2A;
    }

    .nutrient-item.iron .nutrient-icon {
      background-color: #2B8A3E;
    }

    .nutrient-item.calcium .nutrient-icon {
      background-color: #D62865;
    }

    .nutrient-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .nutrient-label {
      font-size: 10.5px;
      font-weight: 700;
      color: #6B7280;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nutrient-value-row {
      display: flex;
      align-items: baseline;
      gap: 3px;
      color: #111827;
    }

    .nutrient-val {
      font-size: 16px;
      font-weight: 800;
      color: #111827;
      transition: opacity 0.2s ease;
    }

    .nutrient-val.loading {
      color: #94A3B8;
      animation: pulseValue 1.1s ease-in-out infinite;
    }

    @keyframes pulseValue {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }

    .nutrient-unit {
      font-size: 12.5px;
      font-weight: 500;
      color: #4B5563;
    }

    /* Primary CTA Button */
    .add-log-btn {
      margin-top: 16px;
      width: 100%;
      height: 54px;
      background-color: #DE2B63;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(222, 43, 99, 0.32);
      transition: transform 0.12s ease, background-color 0.15s ease, opacity 0.15s ease;
    }

    .add-log-btn:active {
      transform: scale(0.985);
    }

    .add-log-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none;
    }

    .add-log-btn.logged {
      background-color: #10B981;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.32);
    }

    /* Secondary Actions Row: Scan Another + Paste Image */
    .secondary-actions {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-divider {
      color: #334155;
      font-size: 14px;
      user-select: none;
    }

    .scan-another-btn {
      background: none;
      border: none;
      color: #76808F;
      font-size: 14.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 10px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .scan-another-btn:hover {
      color: #CBD5E1;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .scan-another-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
    }

    #fileInput, #cameraInput {
      display: none;
    }

    /* Toast Notification System */
    .toast-container {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 390px;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      pointer-events: auto;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.35;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastSlideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.error {
      background-color: #1F131D;
      border: 1px solid #DF2963;
      color: #FFB5CC;
    }

    .toast.success {
      background-color: #0E241B;
      border: 1px solid #10B981;
      color: #A7F3D0;
    }

    .toast.info {
      background-color: #131F33;
      border: 1px solid #3B82F6;
      color: #BFDBFE;
    }

    .toast-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toast-msg {
      flex: 1;
    }

    @keyframes toastSlideDown {
      from {
        opacity: 0;
        transform: translateY(-16px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <div class="screen">
    <!-- Top Header -->
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" type="button" onclick="showHomeView()" aria-label="Back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <h1 class="header-title">Scan Food</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <a href="/admin" class="admin-dashboard-link" style="color: #60A5FA; text-decoration: none; font-size: 11px; font-weight: 700; background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.35); padding: 5px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s;" title="Open Admin Scan Inspector">
          <span>🛡️</span>
          <span>Admin</span>
        </a>
        <a href="https://mdwd-learn-play.vercel.app" class="training-portal-link" style="color: #FBBF24; text-decoration: none; font-size: 11px; font-weight: 700; background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.35); padding: 5px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s;" title="Open MDD-W Training Portal">
          <span>🎓</span>
          <span>MDD-W Portal</span>
        </a>
        <button class="icon-btn" type="button" onclick="showHomeView()" aria-label="Home">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 3l9 7.5"></path>
            <path d="M5 9.5V19a1 1 0 0 0 1 1h4.5v-5.5h3V20H18a1 1 0 0 0 1-1V9.5"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- ==========================================
         VIEW 1: HOME SCREEN (Matches 2nd Screenshot)
         ========================================== -->
    <div id="homeView" class="view-section active">
      <!-- Viewfinder Box -->
      <div id="viewfinderCard" class="viewfinder-card" onclick="triggerGallerySelect()" title="Click to choose photo, drag & drop, or press Ctrl+V to paste">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="viewfinder-circle">
          <!-- Crossed Knife & Fork Icon -->
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"></path>
            <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"></path>
            <path d="m2.1 21.8 6.4-6.3"></path>
            <path d="m19 5-7 7"></path>
          </svg>
        </div>

        <div id="homeScanOverlay" class="scan-overlay">
          <div class="spinner"></div>
          <span>Scanning food...</span>
        </div>
      </div>

      <p class="viewfinder-hint">Point camera at your food or choose a photo</p>

      <!-- Take Photo Button -->
      <button class="btn-take-photo" type="button" onclick="triggerCameraSelect()">

  <script>
    const STORAGE_KEY = 'telugu_food_scanner_scans_v1';

    // Default sample scans matching the UI mockup
    const defaultPreviousScans = [
      {

    let previousScans = [];
    let activeScanId = null;

    // Toast Notification System
    function showToast(message, type = 'error', duration = 3500) {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      let iconHtml = '';
      if (type === 'success') {
        iconHtml = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>`;
      } else if (type === 'error') {
        iconHtml = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DF2963" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>`;
      } else {
        iconHtml = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>`;
      }

      toast.innerHTML = `
        <div class="toast-icon">${iconHtml}</div>
        <div class="toast-msg">${message}</div>
      `;

      container.appendChild(toast);

      const dismissTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px) scale(0.96)';
        setTimeout(() => toast.remove(), 220);
      }, duration);

      toast.onclick = () => {
        clearTimeout(dismissTimer);
        toast.remove();
      };
    }

    // ==========================================
    // FIREBASE FIRESTORE SYNC (mddw-app)
    // Section: food_scanner
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyD_qFQ3sfYueqZ8SLHNnn0ZieugAAjvl10",
      authDomain: "mddw-app.firebaseapp.com",
      projectId: "mddw-app",
      storageBucket: "mddw-app.firebasestorage.app",
      messagingSenderId: "553099343991",
      appId: "1:553099343991:web:6f5cbef598fc40c410ee72",
      measurementId: "G-9CRVLHRFEF"
    };

    const FIRESTORE_COLLECTION = "food_scanner";
    let firestoreDb = null;
    let isFirestoreActive = false;

    function initFirebase() {
      try {
        if (typeof firebase !== 'undefined') {
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          firestoreDb = firebase.firestore();
          setupFirestoreRealtimeSync();
        } else {
          updateSyncBadge(false, 'Local Storage');
        }
      } catch (err) {
        console.warn('Firebase init error:', err);
        updateSyncBadge(false, 'Local Storage');
      }
    }

    function updateSyncBadge(online, text) {
      const badge = document.getElementById('firebaseSyncBadge');
      if (!badge) return;
      if (online) {
        badge.className = 'sync-badge online';
        badge.textContent = '☁️ ' + (text || 'Firebase Synced');
      } else {
        badge.className = 'sync-badge local';
        badge.textContent = '📱 ' + (text || 'Local Storage');
      }
    }

    function setupFirestoreRealtimeSync() {
      if (!firestoreDb) return;
      try {
        firestoreDb.collection(FIRESTORE_COLLECTION)
          .onSnapshot((snapshot) => {
            if (!snapshot.empty) {
              const cloudScans = [];
              snapshot.forEach((doc) => {
                const data = doc.data();
                cloudScans.push({
                  ...data,
                  firestoreId: doc.id
                });
              });
              cloudScans.sort((a, b) => {
                const ta = a.timestamp || (a.created_at_iso ? new Date(a.created_at_iso).getTime() : 0);
                const tb = b.timestamp || (b.created_at_iso ? new Date(b.created_at_iso).getTime() : 0);
                return tb - ta;
              });
              previousScans = cloudScans;
              saveScansToStorage(); // mirror to localStorage
              renderPreviousScans();
              isFirestoreActive = true;
              updateSyncBadge(true, 'Firebase Synced');
            } else {
              isFirestoreActive = true;
              updateSyncBadge(true, 'Firebase Ready');
            }
          }, (err) => {
            console.warn('Firestore sync fallback (rules/offline):', err.message);
            isFirestoreActive = false;
            updateSyncBadge(false, 'Local Storage');
          });
      } catch (err) {
        console.warn('Firestore setup error:', err);
        isFirestoreActive = false;
        updateSyncBadge(false, 'Local Storage');
      }
    }

    async function pushScanToFirestore(entry) {
      if (entry.firestoreId) {
        // Already persisted to Firestore by server
        isFirestoreActive = true;
        updateSyncBadge(true, 'Firebase Synced');
        return;
      }
      if (!firestoreDb) {
        initFirebase();
      }
      if (!firestoreDb) return;
      try {
        const cleanItems = (entry.items || []).map(it => ({
          name_en: it.name_en || '',
          name_te: it.name_te || '',
          cluster: it.cluster || '',
          food_groups: it.food_groups || [],
          grams: it.grams || it.estimated_grams || 0,
          calories: it.calories || (it.nutrition ? it.nutrition.calories : 0) || 0,
          protein_g: it.protein_g || (it.nutrition ? it.nutrition.protein_g : 0) || 0
        }));

        const payload = {
          id: entry.id,
          name: entry.name,
          category: entry.category || 'OTHER',
          timeLabel: entry.timeLabel,
          mealLabel: entry.mealLabel || 'Meal',
          status: entry.status || 'Scanned',
          imageUrl: entry.imageUrl || '', // Base64 compressed image thumbnail
          calories: entry.calories || 0,
          protein_g: entry.protein_g || 0,
          carbs_g: entry.carbs_g || 0,
          fiber_g: entry.fiber_g || 0,
          iron_mg: entry.iron_mg || 0,
          calcium_mg: entry.calcium_mg || 0,
          mddw_score: entry.mddw_score || (entry.mddw_diversity ? entry.mddw_diversity.score : 0) || 0,
          meets_mddw_threshold: entry.meets_mddw_threshold || (entry.mddw_diversity ? entry.mddw_diversity.meets_minimum_diversity : false) || false,
          mddw_groups_covered: entry.mddw_groups_covered || (entry.mddw_diversity ? entry.mddw_diversity.groups_covered : []) || [],
          items: cleanItems,
          timestamp: entry.timestamp || Date.now(),
          created_at_iso: new Date().toISOString(),
          source: 'AIM FOOD SCANNER'
        };
        const docRef = await firestoreDb.collection(FIRESTORE_COLLECTION).add(payload);
        entry.firestoreId = docRef.id;
        isFirestoreActive = true;
        updateSyncBadge(true, 'Firebase Synced');
      } catch (err) {
        console.warn('Firestore write warning:', err.message);
      }
    }

    async function updateScanStatusInFirestore(activeId, status) {
      if (!firestoreDb) initFirebase();
      const entry = previousScans.find((x) => x.id === activeId);
      if (!entry) return;
      if (!entry.firestoreId) {
        entry.status = status;
        await pushScanToFirestore(entry);
        return;
      }
      if (!firestoreDb) return;
      try {
        await firestoreDb.collection(FIRESTORE_COLLECTION).doc(entry.firestoreId).update({
          status: status
        });
      } catch (err) {
        console.warn('Firestore status update warning:', err.message);
      }
    }

    // LocalStorage Management
    function loadScansFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            previousScans = parsed;
            return;
          }
        }
      } catch (err) {
        console.warn('Failed to read from localStorage:', err);
      }
      previousScans = JSON.parse(JSON.stringify(defaultPreviousScans));
      saveScansToStorage();
    }

    function saveScansToStorage() {
      try {
        // Keep at most 25 recent items to bound storage
        const bounded = previousScans.slice(0, 25);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bounded));
      } catch (err) {
        console.warn('LocalStorage save failed, trimming items:', err);
        try {
          const minimal = previousScans.slice(0, 8);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(minimal));
        } catch (innerErr) {
          console.error('Could not save to localStorage:', innerErr);
        }
      }
    }

    function renderPreviousScans() {
      const container = document.getElementById('prevScansList');
      if (!container) return;
      container.innerHTML = previousScans.map((item) => `
        <div class="scan-history-card" onclick="openHistoryItem('${item.id}')">
          <img class="history-thumb" src="${item.imageUrl}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80'" />
          <div class="history-body">
            <div class="history-top-row">
              <span class="history-dish-name">${item.name}</span>
              <div class="history-status-group">
                <span class="status-pill">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                  ${item.status}
                </span>
                <svg class="history-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </div>
            </div>
            <div class="history-meta">${item.timeLabel} &nbsp;•&nbsp; ${item.mealLabel}</div>
            <div class="history-macros">
              <!-- kcal -->
              <div class="macro-col">
                <svg class="macro-mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
                </svg>
                <div class="macro-mini-text">
                  <span class="macro-mini-val">${formatNumber(item.calories, 0)}</span>
                  <span class="macro-mini-lbl">kcal</span>
                </div>
              </div>
              <!-- Protein -->
              <div class="macro-col">
                <svg class="macro-mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
                </svg>
                <div class="macro-mini-text">
                  <span class="macro-mini-val">${formatNumber(item.protein_g, 0)}g</span>
                  <span class="macro-mini-lbl">Protein</span>
                </div>
              </div>
              <!-- Carbs -->
              <div class="macro-col">
                <svg class="macro-mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 22 16 8"></path>
                  <path d="M3.47 12.53 5 11l1.53 1.53a3.5 3.5 0 0 1 0 4.94L5 19l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z"></path>
                  <path d="M7.47 8.53 9 7l1.53 1.53a3.5 3.5 0 0 1 0 4.94L9 15l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z"></path>
                  <path d="M11.47 4.53 13 3l1.53 1.53a3.5 3.5 0 0 1 0 4.94L13 11l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z"></path>
                </svg>
                <div class="macro-mini-text">
                  <span class="macro-mini-val">${formatNumber(item.carbs_g, 0)}g</span>
                  <span class="macro-mini-lbl">Carbs</span>
                </div>
              </div>
              <!-- Fiber -->
              <div class="macro-col">
                <svg class="macro-mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
                  <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
                </svg>
                <div class="macro-mini-text">
                  <span class="macro-mini-val">${formatNumber(item.fiber_g, 0)}g</span>
                  <span class="macro-mini-lbl">Fiber</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function showHomeView() {
      document.getElementById('resultView').classList.remove('active');
      document.getElementById('homeView').classList.add('active');
      renderPreviousScans();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showResultView() {
      document.getElementById('homeView').classList.remove('active');
      document.getElementById('resultView').classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderDetectedItemsChips(itemsList) {
      const row = document.getElementById('detectedItemsRow');
      if (!row) return;
      if (!itemsList || itemsList.length === 0) {
        row.style.display = 'none';
        row.innerHTML = '';
        return;
      }
      row.style.display = 'flex';
      row.innerHTML = itemsList.map((it) => {
        const cleanName = (it.name_en || '').replace(/\s*\([^)]*\)/g, '').trim() || it.name_en || 'Food Item';
        const grams = it.estimated_grams ? `${Math.round(it.estimated_grams)}g` : '';
        const kcal = it.nutrition && it.nutrition.calories != null ? ` · ${Math.round(it.nutrition.calories)} kcal` : '';
        return `<span class="detected-item-chip">${cleanName}${grams || kcal ? ` <span class="detected-item-grams">(${grams}${kcal})</span>` : ''}</span>`;
      }).join('');
    }

    function openHistoryItem(id) {
      const item = previousScans.find((x) => x.id === id);
      if (!item) return;
      activeScanId = item.id;
      document.getElementById('foodImage').src = item.imageUrl;
      document.getElementById('categoryText').textContent = item.category || 'OTHER';
      document.getElementById('dishTitle').textContent = item.name;
      renderDetectedItemsChips(item.items || []);
      document.getElementById('valCalories').textContent = formatNumber(item.calories, 0);
      document.getElementById('valProtein').textContent = formatNumber(item.protein_g, 1);
      document.getElementById('valIron').textContent = formatNumber(item.iron_mg, 1);
      document.getElementById('valCalcium').textContent = formatNumber(item.calcium_mg, 0);
      resetLogButton(item.status === 'Logged');
      showResultView();
    }

    function scrollToHistory() {
      const el = document.getElementById('prevScansList');
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    function triggerGallerySelect() {
      document.getElementById('fileInput').click();
    }

    function triggerCameraSelect() {
      document.getElementById('cameraInput').click();
    }

    function formatNumber(val, decimals = 1) {
      const num = Number(val);
      if (isNaN(num)) return '0';
      if (decimals === 0 || Number.isInteger(num)) {
        return String(Math.round(num));
      }
      return num.toFixed(decimals).replace(/\.0$/, '');
    }

    function mapCategoryLabel(data) {
      const firstItem = (data.items && data.items[0]) || {};
      const cluster = (firstItem.cluster || data.meal_type || '').toUpperCase();
      if (!cluster) return 'OTHER';
      if (cluster.includes('BREAKFAST') || cluster.includes('TIFFIN')) return 'BREAKFAST';
      if (cluster.includes('RICE') || cluster.includes('BIRYANI')) return 'RICE';
      if (cluster.includes('DAL') || cluster.includes('PAPPU')) return 'DAL';
      if (cluster.includes('CURRY') || cluster.includes('FRY') || cluster.includes('GRAVY') || cluster.includes('VEGETABLE')) return 'CURRY';
      if (cluster.includes('SNACK') || cluster.includes('SWEET') || cluster.includes('SALAD') || cluster.includes('FRUIT')) return 'SNACK';
      if (cluster.includes('MEAT') || cluster.includes('FISH') || cluster.includes('EGG')) return 'PROTEIN';
      if (cluster.includes('LUNCH') || cluster.includes('MEAL')) return 'MEAL';
      return 'OTHER';
    }

    function mapShortMealTime(data) {
      const mt = (data.meal_type || '').toLowerCase();
      if (mt.includes('breakfast') || mt.includes('tiffin')) return 'Breakfast';
      if (mt.includes('snack')) return 'Snack';
      if (mt.includes('dinner')) return 'Dinner';
      return 'Lunch';
    }

    /**
     * Client-side image compression:
     * - Resizes to max 900px preserving strict aspect ratio (no distortion).
     * - Supports EXIF orientation via createImageBitmap({ imageOrientation: 'from-image' }).
     * - JPEG quality 0.82 produces a payload of ~90KB - 160KB (target ~100-200KB).
     * - Creates lightweight 280px thumbnail (~15-25KB) specifically for persistent localStorage.
     */
    async function compressImageFile(file, maxDim = 1200, quality = 0.88) {
      if (!file || !file.type || !file.type.startsWith('image/')) {
        throw new Error('Please select an image file (JPG, PNG, WebP).');
      }

      let imgSource;
      let width = 0;
      let height = 0;

      // 1. Try createImageBitmap with automatic EXIF orientation
      if (typeof window.createImageBitmap === 'function') {
        try {
          imgSource = await createImageBitmap(file, { imageOrientation: 'from-image' });
          width = imgSource.width;
          height = imgSource.height;
        } catch (bitmapErr) {
          console.warn('createImageBitmap failed, falling back to Image:', bitmapErr);
        }
      }

      // 2. Fallback to HTMLImageElement
      if (!imgSource) {
        imgSource = await new Promise((resolve, reject) => {
          const img = new Image();
          const objectUrl = URL.createObjectURL(file);
          img.onload = () => {
            URL.revokeObjectURL(objectUrl);
            resolve(img);
          };
          img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error('Failed to load image file.'));
          };
          img.src = objectUrl;
        });
        width = imgSource.naturalWidth || imgSource.width;
        height = imgSource.naturalHeight || imgSource.height;
      }

      if (!width || !height) {
        throw new Error('Could not read image dimensions.');
      }

      // 3. Aspect-ratio preserving target dimensions
      let targetWidth = width;
      let targetHeight = height;
      if (width > maxDim || height > maxDim) {
        if (width >= height) {
          targetWidth = maxDim;
          targetHeight = Math.round((height * maxDim) / width);
        } else {
          targetHeight = maxDim;
          targetWidth = Math.round((width * maxDim) / height);
        }
      }

      // 4. Draw to main canvas
      const canvas = document.createElement('canvas');
      canvas.width = targetWidth;
      canvas.height = targetHeight;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(imgSource, 0, 0, targetWidth, targetHeight);

      // 5. Generate crisp, high-definition thumbnail (800px max, 85% quality) for Firestore & UI
      const thumbMax = 800;
      let thumbW = width;
      let thumbH = height;
      if (width > thumbMax || height > thumbMax) {
        if (width >= height) {
          thumbW = thumbMax;
          thumbH = Math.round((height * thumbMax) / width);
        } else {
          thumbH = thumbMax;
          thumbW = Math.round((width * thumbMax) / height);
        }
      }

      const thumbCanvas = document.createElement('canvas');
      thumbCanvas.width = thumbW;
      thumbCanvas.height = thumbH;
      const thumbCtx = thumbCanvas.getContext('2d');
      thumbCtx.imageSmoothingEnabled = true;
      thumbCtx.imageSmoothingQuality = 'high';
      thumbCtx.drawImage(canvas, 0, 0, thumbW, thumbH);
      const thumbDataUrl = thumbCanvas.toDataURL('image/jpeg', 0.85);

      // 6. Convert main canvas to JPEG blob (~90KB - 160KB)
      const compressedBlob = await new Promise((resolve) => {
        canvas.toBlob(
          (b) => resolve(b),
          'image/jpeg',
          quality
        );
      });

      if (!compressedBlob) {
        throw new Error('Failed to compress image into JPEG blob.');
      }

      const baseName = (file.name || 'scanned_food.jpg').replace(/\.[^.]+$/, '');
      const compressedFile = new File([compressedBlob], `${baseName}.jpg`, { type: 'image/jpeg' });
      const previewUrl = URL.createObjectURL(compressedBlob);

      return {
        file: compressedFile,
        previewUrl,
        thumbDataUrl
      };
    }

    function setScanningPlaceholderState() {
      // Clear previous scan data immediately so stale results are never shown
      document.getElementById('dishTitle').textContent = 'Analyzing plate...';
      document.getElementById('categoryText').textContent = 'IDENTIFYING';
      const itemsRow = document.getElementById('detectedItemsRow');
      if (itemsRow) {
        itemsRow.style.display = 'none';
        itemsRow.innerHTML = '';
      }

      const valCal = document.getElementById('valCalories');
      const valProt = document.getElementById('valProtein');
      const valIron = document.getElementById('valIron');
      const valCalc = document.getElementById('valCalcium');

      valCal.textContent = '—';
      valProt.textContent = '—';
      valIron.textContent = '—';
      valCalc.textContent = '—';

      valCal.classList.add('loading');
      valProt.classList.add('loading');
      valIron.classList.add('loading');
      valCalc.classList.add('loading');

      const addBtn = document.getElementById('addLogBtn');
      if (addBtn) {
        addBtn.disabled = true;
      }
    }

    function clearScanningPlaceholderState() {
      const valCal = document.getElementById('valCalories');
      const valProt = document.getElementById('valProtein');
      const valIron = document.getElementById('valIron');
      const valCalc = document.getElementById('valCalcium');

      valCal.classList.remove('loading');
      valProt.classList.remove('loading');
      valIron.classList.remove('loading');
      valCalc.classList.remove('loading');

      const addBtn = document.getElementById('addLogBtn');
      if (addBtn) {
        addBtn.disabled = false;
      }
    }

    async function scanImageFile(rawFile) {
      if (!rawFile) return;

      if (!rawFile.type || !rawFile.type.startsWith('image/')) {
        showToast('Please select a valid image file (JPG, PNG, or WebP).', 'error');
        return;
      }

      const homeOverlay = document.getElementById('homeScanOverlay');
      const resultOverlay = document.getElementById('resultScanOverlay');
      const foodImg = document.getElementById('foodImage');

      // Show spinner on homeView while preparing
      homeOverlay.classList.add('active');

      let compressed;
      try {
        compressed = await compressImageFile(rawFile);
      } catch (err) {
        console.error('Compression error:', err);
        homeOverlay.classList.remove('active');
        showToast(err.message || 'Could not process image file.', 'error');
        return;
      }

      if (compressed.previewUrl) {
        foodImg.src = compressed.previewUrl;
      }
      resetLogButton(false);
      // Immediately clear old scan results before showing result view
      setScanningPlaceholderState();
      showResultView();
      resultOverlay.classList.add('active');
      homeOverlay.classList.remove('active');

      try {
        const formData = new FormData();
        formData.append('file', compressed.file);
        formData.append('preferred_model', 'auto');

        const response = await fetch('/api/v1/scan', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || `Server error (${response.status})`);
        }

        if (data.is_food_image === false) {
          showToast('No food detected in this photo. Point camera directly at a dish for best results.', 'info', 4500);
        } else {
          showToast('Food recognized successfully!', 'success', 2500);
        }

        clearScanningPlaceholderState();
        renderScanResult(data, compressed.thumbDataUrl || compressed.previewUrl);
      } catch (err) {
        console.error('Food scan error:', err);
        clearScanningPlaceholderState();
        const errMsg = err.message || 'Scan failed';
        showToast(`Scan failed: ${errMsg}`, 'error', 4500);
        document.getElementById('dishTitle').textContent = 'Could not recognize food — tap photo to retry';
        document.getElementById('categoryText').textContent = 'RETRY';
        const addBtn = document.getElementById('addLogBtn');
        if (addBtn) addBtn.disabled = true;
      } finally {
        homeOverlay.classList.remove('active');
        resultOverlay.classList.remove('active');
      }
    }

    async function handleFileSelected(event) {
      const rawFile = event.target.files && event.target.files[0];
      if (!rawFile) return;
      await scanImageFile(rawFile);
      event.target.value = '';
    }

    function renderScanResult(data, thumbUrl) {
      const totals = data.totals || {};
      const itemsList = data.items || [];
      const firstItem = itemsList[0] || {};

      let dishName = data.plate_title_en || firstItem.name_en || 'Recognized Dish';
      if (itemsList.length === 1 && firstItem.name_en) {
        dishName = firstItem.name_en;
      } else if (itemsList.length > 1 && !data.plate_title_en) {
        dishName = itemsList.map((it) => (it.name_en || '').replace(/\s*\([^)]*\)/g, '').trim()).join(', ');
      }
      const catLabel = mapCategoryLabel(data);

      document.getElementById('dishTitle').textContent = dishName;
      document.getElementById('categoryText').textContent = catLabel;
      renderDetectedItemsChips(itemsList);

      const cal = totals.calories ?? 0;
      const prot = totals.protein_g ?? 0;
      const carbs = totals.carbs_g ?? 0;
      const fiber = totals.fiber_g ?? 0;
      const iron = totals.iron_mg ?? 0;
      const calcium = totals.calcium_mg ?? 0;

      document.getElementById('valCalories').textContent = formatNumber(cal, 0);
      document.getElementById('valProtein').textContent = formatNumber(prot, 1);
      document.getElementById('valIron').textContent = formatNumber(iron, 1);
      document.getElementById('valCalcium').textContent = formatNumber(calcium, 0);

      // Prepend to Previous Scans history & persist to localStorage
      const nowStr = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const newEntry = {
        id: 'scan-' + Date.now(),
        name: dishName,
        items: itemsList,
        category: catLabel,
        timeLabel: `Today, ${nowStr}`,
        mealLabel: mapShortMealTime(data),
        status: 'Scanned',
        imageUrl: thumbUrl || document.getElementById('foodImage').src,
        calories: cal,
        protein_g: prot,
        carbs_g: carbs,
        fiber_g: fiber,
        iron_mg: iron,
        calcium_mg: calcium,
        mddw_score: (data.mddw_diversity && data.mddw_diversity.score) || 0,
        meets_mddw_threshold: (data.mddw_diversity && data.mddw_diversity.meets_minimum_diversity) || false,
        mddw_groups_covered: (data.mddw_diversity && data.mddw_diversity.groups_covered) || [],
        mddw_diversity: data.mddw_diversity || null,
        timestamp: Date.now()
      };
      activeScanId = newEntry.id;
      if (data && data.firestore_id) {
        newEntry.firestoreId = data.firestore_id;
        isFirestoreActive = true;
        updateSyncBadge(true, 'Firebase Synced');
      }
      previousScans.unshift(newEntry);
      saveScansToStorage();
      renderPreviousScans();
      pushScanToFirestore(newEntry);
    }

    function handleAddLog() {
      if (activeScanId) {
        const entry = previousScans.find((x) => x.id === activeScanId);
        if (entry) {
          entry.status = 'Logged';
          saveScansToStorage();
          renderPreviousScans();
          updateScanStatusInFirestore(activeScanId, 'Logged');
          resetLogButton(true);
          showToast(`${entry.name} added to today's log!`, 'success');
          return;
        }
      }
      resetLogButton(true);
      showToast("Added to today's log!", 'success');
    }

    function resetLogButton(isLogged) {
      const btn = document.getElementById('addLogBtn');
      const txt = document.getElementById('addLogText');
      const icon = document.getElementById('addLogIcon');
      if (isLogged) {
        btn.classList.add('logged');
        txt.textContent = "Added to today's log";
        if (icon) {
          icon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
        }
      } else {
        btn.classList.remove('logged');
        txt.textContent = "Add to today's log";
        if (icon) {
          icon.innerHTML = '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>';
        }
      }
    }

    // 1. Global Ctrl+V / Cmd+V Paste Listener for Desktop / Laptop Users
    window.addEventListener('paste', async (event) => {
      const clipboardData = event.clipboardData || window.clipboardData;
      if (!clipboardData) return;

      const items = clipboardData.items || [];
      for (let i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.startsWith('image/')) {
          event.preventDefault();
          const blob = items[i].getAsFile();
          if (blob) {
            showToast('Pasting image from clipboard...', 'info', 1800);
            await scanImageFile(blob);
            return;
          }
        }
      }

      if (clipboardData.files && clipboardData.files.length > 0) {
        for (let i = 0; i < clipboardData.files.length; i++) {
          if (clipboardData.files[i].type && clipboardData.files[i].type.startsWith('image/')) {
            event.preventDefault();
            showToast('Pasting image from clipboard...', 'info', 1800);
            await scanImageFile(clipboardData.files[i]);
            return;
          }
        }
      }

      // If user pasted something non-image while on the app
      showToast('No image in clipboard. Copy an image or screenshot first, then press Ctrl+V.', 'info', 3000);
    });

    // 2. Clickable "Paste Image (Ctrl+V)" Button using Clipboard API
    async function pasteFromClipboardButton() {
      const pasteBtnText = document.getElementById('pasteBtnText');
      const homePasteText = document.getElementById('homePasteBtnText');

      try {
        if (!navigator.clipboard || !navigator.clipboard.read) {
          showToast('Clipboard direct read not supported by browser. Press Ctrl+V (or ⌘+V) to paste.', 'info', 3500);
          return;
        }

        const clipboardItems = await navigator.clipboard.read();
        for (const item of clipboardItems) {
          const imageType = item.types.find((type) => type.startsWith('image/'));
          if (imageType) {
            const blob = await item.getType(imageType);
            const ext = imageType.split('/')[1] || 'png';
            const file = new File([blob], `pasted_food.${ext}`, { type: imageType });
            showToast('Reading image from clipboard...', 'info', 1800);
            await scanImageFile(file);
            return;
          }
        }

        showToast('No image found in clipboard. Copy an image or screenshot, then paste.', 'info', 3200);
      } catch (err) {
        console.warn('Clipboard read fallback:', err);
        showToast('Clipboard access denied or unavailable. Please press Ctrl+V on your keyboard.', 'info', 3500);
      }
    }

    // 3. Drag & Drop Image Support
    const viewfinderCard = document.getElementById('viewfinderCard');
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (viewfinderCard) viewfinderCard.classList.add('drag-over');
    });
    window.addEventListener('dragleave', (e) => {
      if (!e.relatedTarget && viewfinderCard) {
        viewfinderCard.classList.remove('drag-over');
      }
    });
    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      if (viewfinderCard) viewfinderCard.classList.remove('drag-over');
      const files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length > 0) {
        if (files[0].type && files[0].type.startsWith('image/')) {
          showToast('Processing dropped image...', 'info', 1800);
          await scanImageFile(files[0]);
        } else {
          showToast('Please drop a valid image file (JPG, PNG, WebP).', 'error');
        }
      }
    });

    // Initialize: load persisted scans from localStorage on boot
    loadScansFromStorage();
    renderPreviousScans();
    initFirebase();
  </script>
</body>
</html>
